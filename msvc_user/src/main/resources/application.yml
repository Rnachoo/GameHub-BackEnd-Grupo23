server:
  port: 8002

spring:
  application:
    name: msvc-user

  datasource:
    url: jdbc:h2:file:./data/user_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Clave compartida con el Gateway y los demás servicios (variable de entorno, sin valor por defecto)
jwt:
  secret: ${JWT_SECRET}